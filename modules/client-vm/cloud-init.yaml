#cloud-config
package_update: true
package_upgrade: true

# Pinned major version rather than the unversioned metapackage, so the client's
# pgbench always matches the server major version under test (16 for both the
# IaaS VM and the PaaS Flexible Server). pgbench ships in this package.
packages:
  - postgresql-16

runcmd:
  # This machine only runs pgbench/psql against remote servers — the local
  # PostgreSQL instance pulled in as a dependency of postgresql-contrib is
  # not needed and is stopped so it doesn't consume CPU/RAM during tests.
  - systemctl stop postgresql
  - systemctl disable postgresql